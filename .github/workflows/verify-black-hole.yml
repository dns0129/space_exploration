name: Verify black-hole system

on:
  push:
    branches: [codex/black-hole]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-hole-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Record cloud runtime and tested revision
        run: |
          mkdir -p test-results
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const runtime = {
            node: process.version,
            npm: execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(),
            revision: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            platform: process.platform,
            architecture: process.arch,
          };
          if (Number(process.versions.node.split(".")[0]) !== 24) throw new Error("Node.js 24 is required");
          writeFileSync("test-results/cloud-runtime.json", JSON.stringify(runtime, null, 2) + "\n");
          console.log(JSON.stringify(runtime, null, 2));
          NODE
      - run: npm ci --no-fund --no-audit
      - name: Install cloud Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Select the installed Chromium for all verification scripts
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import { appendFileSync, existsSync } from "node:fs";
          const executable = chromium.executablePath();
          if (!existsSync(executable)) throw new Error("Installed Chromium executable is missing");
          appendFileSync(process.env.GITHUB_ENV, `PLAYWRIGHT_CHROMIUM_EXECUTABLE=${executable}\n`);
          console.log(`Chromium: ${executable}`);
          NODE
      - name: Unit, dynamics, persistence and backend integration tests
        run: npm run test:server
      - name: Type check and production game build
        run: npm run build
      - name: Black-hole desktop and narrow-screen browser verification
        run: npx playwright test tests/black-hole.spec.ts --reporter=line,html
      - name: Verify the built website and project paths
        run: npm run test:site
      - name: Export and verify the disconnected standalone game
        run: npm run test:offline
      - name: Upload screenshots, browser traces and actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-hole-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
      - name: Upload the verified offline package
        uses: actions/upload-artifact@v4
        with:
          name: black-hole-offline-${{ github.sha }}
          path: downloads/voyager-warp.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  refresh-offline-package:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/black-hole'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: black-hole-offline-${{ github.sha }}
          path: downloads
      - name: Commit only the verified package to the unchanged feature branch
        env:
          VERIFIED_SHA: ${{ github.sha }}
          FEATURE_BRANCH: codex/black-hole
        run: |
          git fetch origin "$FEATURE_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$VERIFIED_SHA" ]; then
            echo "Feature branch moved after validation; refusing to publish a stale package." >&2
            exit 1
          fi
          git add -- downloads/voyager-warp.zip
          if git diff --cached --quiet; then
            echo "The tracked offline package already matches the verified export." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh verified black-hole offline package"
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
          echo "Verified source revision: $VERIFIED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Offline package commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "The package commit uses GITHUB_TOKEN and does not trigger another push workflow. Open the PR after this step to run read-only verification for the final head." >> "$GITHUB_STEP_SUMMARY"
